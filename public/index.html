<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Super Analyst — Beratung Hagl</title>
<link rel="icon" href="logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg:           #f5f7f3;
  --surface:      #ffffff;
  --border:       #e2e8de;
  --border-focus: #517f34;
  --text:         #0f1a0a;
  --text-muted:   #5c6b52;
  --text-subtle:  #8a9e7e;
  --primary:      #517f34;
  --primary-fg:   #ffffff;
  --primary-hover:#3f6428;
  --tint:         #eef4e8;
  --tint-strong:  #d4e8c2;
  --ring:         rgba(81,127,52,0.2);
  --good:         #517f34;
  --mid:          #c47c1e;
  --low:          #b83232;
  --radius:       8px;
  --radius-lg:    12px;
  --shadow-sm:    0 1px 3px rgba(0,0,0,0.06), 0 1px 2px rgba(0,0,0,0.04);
  --shadow-md:    0 4px 12px rgba(0,0,0,0.08), 0 2px 4px rgba(0,0,0,0.04);
  --shadow-lg:    0 10px 28px rgba(0,0,0,0.1), 0 4px 8px rgba(0,0,0,0.06);
}

body {
  font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  font-size: 14px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}

/* ── Header ── */
header {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 0 2rem;
  height: 56px;
  display: flex;
  align-items: center;
  gap: 0.75rem;
  position: sticky;
  top: 0;
  z-index: 50;
  box-shadow: var(--shadow-sm);
}
header .logo { height: 32px; width: auto; display: block; }
header .header-title { font-size: 0.95rem; font-weight: 700; letter-spacing: -0.01em; }
header .header-sub { font-size: 0.75rem; color: var(--text-muted); }
header .divider { width: 1px; height: 24px; background: var(--border); margin: 0 0.25rem; }

main {
  max-width: 960px;
  margin: 2rem auto;
  padding: 0 1.5rem;
}

/* ── Card ── */
.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 1.5rem;
  box-shadow: var(--shadow-sm);
}

/* ── Form elements ── */
.field { margin-bottom: 1rem; }
.field:last-of-type { margin-bottom: 0; }

.label {
  display: block;
  font-size: 0.8125rem;
  font-weight: 600;
  color: var(--text);
  margin-bottom: 0.375rem;
  letter-spacing: 0.01em;
}
.label .optional-tag {
  font-weight: 400;
  color: var(--text-subtle);
  font-size: 0.75rem;
  margin-left: 0.25rem;
}

.input {
  width: 100%;
  padding: 0.5rem 0.75rem;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  font-size: 0.875rem;
  font-family: inherit;
  color: var(--text);
  background: var(--surface);
  transition: border-color 0.15s, box-shadow 0.15s;
  outline: none;
}
.input::placeholder { color: var(--text-subtle); }
.input:focus {
  border-color: var(--border-focus);
  box-shadow: 0 0 0 3px var(--ring);
}

.checkbox-row {
  display: flex;
  align-items: center;
  gap: 0.5rem;
  padding: 0.5rem 0;
}
.checkbox-row input[type="checkbox"] {
  width: 15px; height: 15px;
  accent-color: var(--primary);
  cursor: pointer;
}
.checkbox-row label {
  font-size: 0.875rem;
  font-weight: 400;
  color: var(--text);
  cursor: pointer;
  user-select: none;
}

.form-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 0.75rem;
  margin-top: 1rem;
  padding-top: 1rem;
  border-top: 1px solid var(--border);
}

.separator { border: none; border-top: 1px solid var(--border); margin: 1rem 0; }

/* ── Buttons ── */
.btn-primary {
  width: 100%;
  padding: 0.5625rem 1rem;
  background: var(--primary);
  color: var(--primary-fg);
  border: none;
  border-radius: var(--radius);
  font-size: 0.875rem;
  font-weight: 600;
  font-family: inherit;
  cursor: pointer;
  transition: background 0.15s, box-shadow 0.15s;
  letter-spacing: 0.01em;
}
.btn-primary:hover:not(:disabled) {
  background: var(--primary-hover);
  box-shadow: var(--shadow-sm);
}
.btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }

.btn-outline {
  padding: 0.4375rem 0.875rem;
  background: var(--surface);
  color: var(--text);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  font-size: 0.8125rem;
  font-weight: 500;
  font-family: inherit;
  cursor: pointer;
  transition: background 0.15s, border-color 0.15s;
  display: inline-flex;
  align-items: center;
  gap: 0.375rem;
  text-decoration: none;
}
.btn-outline:hover { background: var(--tint); border-color: var(--tint-strong); }

.btn-primary-sm {
  padding: 0.4375rem 0.875rem;
  background: var(--primary);
  color: var(--primary-fg);
  border: none;
  border-radius: var(--radius);
  font-size: 0.8125rem;
  font-weight: 600;
  font-family: inherit;
  cursor: pointer;
  transition: background 0.15s;
  display: inline-flex;
  align-items: center;
  gap: 0.375rem;
  text-decoration: none;
}
.btn-primary-sm:hover { background: var(--primary-hover); }

.btn-ghost {
  background: none;
  border: none;
  color: var(--primary);
  font-size: 0.8125rem;
  font-weight: 500;
  font-family: inherit;
  cursor: pointer;
  padding: 0.25rem 0;
  display: inline-flex;
  align-items: center;
  gap: 0.375rem;
}
.btn-ghost:hover { color: var(--primary-hover); text-decoration: underline; }

/* ── Badge ── */
.badge {
  display: inline-flex;
  align-items: center;
  gap: 0.25rem;
  padding: 0.1875rem 0.5rem;
  border-radius: 9999px;
  font-size: 0.6875rem;
  font-weight: 600;
  letter-spacing: 0.03em;
}
.badge-green { background: var(--tint); color: var(--primary); border: 1px solid var(--tint-strong); }
.badge-gray  { background: #f1f5f0; color: var(--text-muted); border: 1px solid var(--border); }

/* ── Progress ── */
.progress-header {
  display: flex;
  align-items: center;
  gap: 0.625rem;
  margin-bottom: 1rem;
}
.progress-header h3 {
  font-size: 0.9375rem;
  font-weight: 600;
  color: var(--text);
}
.spinner {
  width: 16px; height: 16px;
  border: 2px solid var(--tint-strong);
  border-top-color: var(--primary);
  border-radius: 50%;
  animation: spin 0.75s linear infinite;
  flex-shrink: 0;
}
@keyframes spin { to { transform: rotate(360deg); } }

.progress-log {
  font-size: 0.8125rem;
  line-height: 1.9;
  color: var(--text-muted);
  font-family: "Inter", monospace;
}

/* ── Dashboard header ── */
.dash-header {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 1rem;
  margin-bottom: 1.5rem;
  flex-wrap: wrap;
}
.dash-title { font-size: 1.5rem; font-weight: 800; letter-spacing: -0.025em; }
.dash-sub { font-size: 0.8125rem; color: var(--text-muted); margin-top: 0.25rem; display: flex; align-items: center; gap: 0.5rem; }
.dash-actions { display: flex; gap: 0.5rem; flex-wrap: wrap; align-items: center; }

/* ── Scoring panel ── */
.scoring-panel {
  display: grid;
  grid-template-columns: 1.4fr repeat(4, 1fr);
  gap: 0.75rem;
  margin-bottom: 1.25rem;
}

.gauge-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 1.25rem 0.75rem 1rem;
  text-align: center;
  box-shadow: var(--shadow-sm);
}
.gauge-card.featured {
  background: var(--tint);
  border-color: var(--tint-strong);
}
.gauge-card svg { display: block; margin: 0 auto; overflow: visible; }
.gauge-label {
  font-size: 0.75rem;
  font-weight: 600;
  color: var(--text-muted);
  margin-top: 0.5rem;
  letter-spacing: 0.02em;
}
.gauge-card.featured .gauge-label { color: var(--primary); }

/* ── Executive card ── */
.exec-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 1.25rem 1.5rem;
  margin-bottom: 1.25rem;
  box-shadow: var(--shadow-sm);
}
.exec-card-header {
  display: flex;
  align-items: center;
  gap: 0.5rem;
  margin-bottom: 0.875rem;
}
.exec-card-header .icon-wrap {
  width: 28px; height: 28px;
  background: var(--tint);
  border-radius: 6px;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}
.exec-card-header h3 {
  font-size: 0.875rem;
  font-weight: 700;
  color: var(--text);
  letter-spacing: -0.01em;
}
.exec-card ul { padding-left: 1.25rem; }
.exec-card li {
  font-size: 0.875rem;
  color: var(--text);
  margin-bottom: 0.3125rem;
  line-height: 1.6;
}

/* ── Section grid ── */
.grid-label {
  font-size: 0.6875rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--text-subtle);
  margin: 1.5rem 0 0.75rem;
}

.section-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 0.75rem;
}

.section-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 1.125rem;
  cursor: pointer;
  text-align: left;
  font-family: inherit;
  transition: border-color 0.15s, box-shadow 0.15s, transform 0.15s;
  display: flex;
  flex-direction: column;
  gap: 0.5rem;
  box-shadow: var(--shadow-sm);
}
.section-card:hover {
  border-color: var(--primary);
  box-shadow: var(--shadow-md);
  transform: translateY(-2px);
}
.section-card:hover .card-arrow { color: var(--primary); }

.card-icon-row { display: flex; align-items: center; justify-content: space-between; }
.card-icon {
  width: 36px; height: 36px;
  border-radius: 8px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--tint);
  color: var(--primary);
  flex-shrink: 0;
}
.card-icon svg { width: 18px; height: 18px; }

.card-title {
  font-size: 0.875rem;
  font-weight: 700;
  color: var(--text);
  letter-spacing: -0.01em;
}
.card-desc {
  font-size: 0.75rem;
  color: var(--text-muted);
  line-height: 1.5;
}
.card-arrow {
  font-size: 0.75rem;
  font-weight: 600;
  color: var(--text-subtle);
  margin-top: auto;
  display: flex;
  align-items: center;
  gap: 0.25rem;
  transition: color 0.15s;
}

/* ── Section detail ── */
.breadcrumb {
  display: flex;
  align-items: center;
  gap: 0.375rem;
  font-size: 0.8125rem;
  color: var(--text-muted);
  margin-bottom: 1.25rem;
}
.breadcrumb a {
  color: var(--primary);
  text-decoration: none;
  font-weight: 500;
}
.breadcrumb a:hover { text-decoration: underline; }
.breadcrumb .sep { color: var(--text-subtle); }

.section-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 1.25rem;
  padding-bottom: 1.125rem;
  border-bottom: 1px solid var(--border);
  flex-wrap: wrap;
  gap: 0.75rem;
}
.section-header-left { display: flex; align-items: center; gap: 0.75rem; }
.section-icon-lg {
  width: 44px; height: 44px;
  border-radius: 10px;
  background: var(--tint);
  border: 1px solid var(--tint-strong);
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--primary);
  flex-shrink: 0;
}
.section-icon-lg svg { width: 22px; height: 22px; }
.section-heading { font-size: 1.25rem; font-weight: 800; letter-spacing: -0.02em; }

.section-nav { display: flex; gap: 0.5rem; }

/* ── Markdown content ── */
.md-body { font-size: 0.875rem; line-height: 1.75; color: var(--text); }
.md-body h1 { font-size: 1.25rem; font-weight: 800; margin: 1.5rem 0 0.625rem; letter-spacing: -0.02em; }
.md-body h2 {
  font-size: 1rem;
  font-weight: 700;
  margin: 1.5rem 0 0.5rem;
  color: var(--primary);
  letter-spacing: -0.01em;
}
.md-body h3 { font-size: 0.9375rem; font-weight: 600; margin: 1.25rem 0 0.375rem; }
.md-body p { margin-bottom: 0.75rem; }
.md-body table {
  width: 100%;
  border-collapse: collapse;
  margin: 1rem 0;
  font-size: 0.8125rem;
  border-radius: var(--radius);
  overflow: hidden;
  border: 1px solid var(--border);
}
.md-body th {
  background: var(--tint);
  padding: 0.5rem 0.75rem;
  text-align: left;
  font-weight: 600;
  font-size: 0.75rem;
  color: var(--text);
  border-bottom: 1px solid var(--border);
}
.md-body td {
  padding: 0.5rem 0.75rem;
  border-bottom: 1px solid var(--border);
  vertical-align: top;
  color: var(--text);
}
.md-body tr:last-child td { border-bottom: none; }
.md-body tr:nth-child(even) td { background: #fafcf8; }
.md-body ul, .md-body ol { padding-left: 1.375rem; margin-bottom: 0.75rem; }
.md-body li { margin-bottom: 0.3125rem; }
.md-body code {
  background: var(--tint);
  padding: 0.125rem 0.375rem;
  border-radius: 4px;
  font-size: 0.8125em;
  font-family: "SF Mono", "Consolas", monospace;
  color: var(--primary-hover);
}
.md-body hr { border: none; border-top: 1px solid var(--border); margin: 1.25rem 0; }
.md-body strong { font-weight: 700; }
.md-body em { font-style: italic; color: var(--text-muted); }

/* ── Error ── */
.alert-error {
  background: #fff8f8;
  border: 1px solid #fecaca;
  border-radius: var(--radius);
  padding: 0.75rem 1rem;
  color: #991b1b;
  font-size: 0.8125rem;
  display: none;
  margin-top: 0.75rem;
  display: flex;
  align-items: flex-start;
  gap: 0.5rem;
}
.alert-error.visible { display: flex; }

[hidden] { display: none !important; }

@media (max-width: 720px) {
  .scoring-panel { grid-template-columns: repeat(2, 1fr); }
  .section-grid   { grid-template-columns: repeat(2, 1fr); }
  .form-grid      { grid-template-columns: 1fr; }
}
@media (max-width: 480px) {
  .section-grid { grid-template-columns: 1fr; }
  main { margin: 1.25rem auto; }
}
</style>
</head>
<body>

<header>
  <img class="logo" src="logo.png" alt="Beratung Hagl">
  <div class="divider"></div>
  <div>
    <div class="header-title">Super Analyst</div>
    <div class="header-sub">KI-gestützte Unternehmensanalyse</div>
  </div>
</header>

<main>

  <!-- ═══ VIEW: INPUT ═══ -->
  <section id="view-input">
    <div class="card" style="max-width:600px; margin:0 auto;">
      <div style="margin-bottom:1.25rem;">
        <h1 style="font-size:1.125rem;font-weight:700;letter-spacing:-0.015em;">Neue Analyse</h1>
        <p style="font-size:0.8125rem;color:var(--text-muted);margin-top:0.25rem;">Unternehmenswebsite eingeben — die KI übernimmt den Rest.</p>
      </div>

      <div class="field">
        <label class="label" for="url">Unternehmenswebsite</label>
        <input class="input" type="text" id="url"
               placeholder="https://www.beispiel.de" autocomplete="off" />
      </div>

      <hr class="separator">

      <p style="font-size:0.75rem;font-weight:600;color:var(--text-muted);letter-spacing:0.04em;text-transform:uppercase;margin-bottom:0.75rem;">Optionale Quellen</p>

      <div class="form-grid" style="margin-top:0;">
        <div class="field" style="margin-bottom:0;">
          <label class="label" for="linkedin">LinkedIn-URL <span class="optional-tag">optional</span></label>
          <input class="input" type="text" id="linkedin"
                 placeholder="linkedin.com/company/…" autocomplete="off" />
        </div>
        <div style="display:flex;align-items:flex-end;padding-bottom:0.5rem;">
          <div class="checkbox-row">
            <input type="checkbox" id="google">
            <label for="google">Google News einbeziehen</label>
          </div>
        </div>
      </div>

      <div style="margin-top:1.25rem;">
        <button class="btn-primary" id="start-btn" type="button" onclick="startAnalysis()">
          Analyse starten
        </button>
      </div>

      <div class="alert-error" id="error-box" style="display:none;">
        <svg width="15" height="15" viewBox="0 0 15 15" fill="none" style="flex-shrink:0;margin-top:1px">
          <path d="M7.5 1a6.5 6.5 0 1 0 0 13A6.5 6.5 0 0 0 7.5 1zM7 4h1v5H7V4zm0 6h1v1H7v-1z" fill="currentColor"/>
        </svg>
        <span id="error-msg"></span>
      </div>
    </div>
  </section>

  <!-- ═══ VIEW: PROGRESS ═══ -->
  <section id="view-progress" hidden>
    <div class="card" style="max-width:600px;margin:0 auto;">
      <div class="progress-header">
        <div class="spinner" id="progress-spinner"></div>
        <h3 id="progress-title">Analyse läuft…</h3>
      </div>
      <div class="progress-log" id="progress-log"></div>
    </div>
  </section>

  <!-- ═══ VIEW: DASHBOARD ═══ -->
  <section id="view-dashboard" hidden>

    <div class="dash-header">
      <div>
        <h2 class="dash-title" id="dash-company">–</h2>
        <div class="dash-sub">
          <span id="dash-sub-text"></span>
        </div>
      </div>
      <div class="dash-actions">
        <a class="btn-primary-sm" id="download-btn" href="#" download>
          <svg width="14" height="14" viewBox="0 0 15 15" fill="none"><path d="M7.5 10.5l-4-4h2.5V2h3v4.5H11.5l-4 4zm-5 2v1.5h10V12.5H2.5z" fill="currentColor"/></svg>
          Report herunterladen
        </a>
        <button class="btn-outline" type="button" onclick="resetApp()">
          <svg width="13" height="13" viewBox="0 0 15 15" fill="none"><path d="M1.5 7.5a6 6 0 0 1 6-6 6 6 0 0 1 4.24 1.76L13 1.5v4H9l1.41-1.41A4.5 4.5 0 1 0 12 7.5H13.5A6 6 0 0 1 1.5 7.5z" fill="currentColor"/></svg>
          Neue Analyse
        </button>
      </div>
    </div>

    <!-- Scoring -->
    <div class="scoring-panel" id="scoring-panel"></div>

    <!-- Executive summary -->
    <div class="exec-card" id="exec-card" hidden>
      <div class="exec-card-header">
        <div class="icon-wrap">
          <svg width="14" height="14" viewBox="0 0 15 15" fill="none">
            <path d="M7.5 1L9.5 5.5H14L10.5 8.5L12 13L7.5 10L3 13L4.5 8.5L1 5.5H5.5L7.5 1Z" fill="var(--primary)"/>
          </svg>
        </div>
        <h3>Executive Summary</h3>
      </div>
      <div id="exec-content" class="md-body"></div>
    </div>

    <!-- Section grid -->
    <div class="grid-label">Analysebereiche</div>
    <div class="section-grid" id="section-grid"></div>

  </section>

  <!-- ═══ VIEW: SECTION DETAIL ═══ -->
  <section id="view-section" hidden>
    <div class="breadcrumb">
      <a href="#" onclick="showDashboard();return false;">Dashboard</a>
      <span class="sep">›</span>
      <span id="breadcrumb-title" style="color:var(--text);">–</span>
    </div>
    <div class="card">
      <div class="section-header">
        <div class="section-header-left">
          <div class="section-icon-lg" id="section-icon-lg"></div>
          <h2 class="section-heading" id="section-heading">–</h2>
        </div>
        <div class="section-nav" id="section-nav"></div>
      </div>
      <div id="section-content" class="md-body"></div>
    </div>
  </section>

</main>

<script>
/* ── SVG icon library ── */
const SVGS = {
  scoring: `<svg viewBox="0 0 15 15" fill="none"><rect x="1" y="8" width="3" height="6" rx="1" fill="currentColor"/><rect x="5.5" y="5" width="3" height="9" rx="1" fill="currentColor"/><rect x="10" y="2" width="3" height="12" rx="1" fill="currentColor"/></svg>`,
  profil:  `<svg viewBox="0 0 15 15" fill="none"><path d="M3 12.5c0-2 2-3.5 4.5-3.5S12 10.5 12 12.5M7.5 8a2.5 2.5 0 1 0 0-5 2.5 2.5 0 0 0 0 5z" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>`,

  ai:      `<svg viewBox="0 0 15 15" fill="none"><path d="M7.5 1L8.5 4h3l-2.5 2 1 3L7.5 7.5 5 9l1-3L3.5 4h3L7.5 1z" fill="currentColor"/><circle cx="3" cy="12" r="1.5" fill="currentColor" opacity=".5"/><circle cx="12" cy="12" r="1.5" fill="currentColor" opacity=".5"/><path d="M3 12h4.5M7.5 12H12" stroke="currentColor" stroke-width="1" opacity=".5"/></svg>`,
  strategy:`<svg viewBox="0 0 15 15" fill="none"><circle cx="7.5" cy="7.5" r="6" stroke="currentColor" stroke-width="1.3"/><circle cx="7.5" cy="7.5" r="3.5" stroke="currentColor" stroke-width="1.3"/><circle cx="7.5" cy="7.5" r="1" fill="currentColor"/></svg>`,
  hypothese:`<svg viewBox="0 0 15 15" fill="none"><path d="M7.5 1.5a3.5 3.5 0 0 1 1.5 6.7V10h-3V8.2A3.5 3.5 0 0 1 7.5 1.5z" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/><rect x="5.5" y="11" width="4" height="1.5" rx=".75" fill="currentColor"/></svg>`,
  default: `<svg viewBox="0 0 15 15" fill="none"><path d="M2 3h11M2 7h11M2 11h7" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>`,
};

const SECTION_META = [
  { re: /executive/i,             icon: "hypothese", desc: "Wichtigste Erkenntnisse auf einen Blick" },
  { re: /scoring/i,               icon: "scoring",   desc: "Bewertung aller Analysedimensionen" },
  { re: /unternehmensprofil|profil/i, icon: "profil",desc: "Firmendaten & Ansprechpartner" },
  { re: /datenquellen/i,          icon: "quellen",   desc: "Status der genutzten Datenquellen" },
  { re: /external intelligence/i, icon: "external",  desc: "Externe Markt- und Wettbewerbssignale" },
  { re: /demand/i,                icon: "demand",    desc: "Sichtbarkeit, Keywords & Nachfragepotenziale" },
  { re: /competitive/i,           icon: "compete",   desc: "Wettbewerber & Marktpositionierung" },
  { re: /ai visibility|ki/i,      icon: "ai",        desc: "Präsenz in KI-Systemen & AI-Suche" },
  { re: /strateg/i,               icon: "strategy",  desc: "Zielgruppe, Positionierung & Wachstum" },
  { re: /beratungshypothesen|hypothesen/i, icon: "hypothese", desc: "Hypothesen für das Erstgespräch" },
];

function metaFor(title) {
  for (const m of SECTION_META) if (m.re.test(title)) return m;
  return { icon: "default", desc: "" };
}

/* ── State ── */
let reportText = "";
let sections   = [];
let currentIdx = 0;

/* ── Views ── */
function showView(name) {
  ["input","progress","dashboard","section"].forEach(v =>
    document.getElementById("view-" + v).hidden = (v !== name));
  window.scrollTo({ top: 0, behavior: "smooth" });
}
function showDashboard() { showView("dashboard"); }
function resetApp() {
  showView("input");
  document.getElementById("error-box").style.display = "none";
  document.getElementById("progress-log").innerHTML = "";
}

/* ── Error ── */
function showError(msg) {
  const box = document.getElementById("error-box");
  document.getElementById("error-msg").textContent = msg;
  box.style.display = "flex";
}

/* ── Progress log ── */
function logMsg(msg) {
  const el = document.getElementById("progress-log");
  el.innerHTML += msg + "<br>";
}

/* ── Gauges ── */
function scoreColor(s) {
  return s >= 7 ? "var(--good)" : s >= 4 ? "var(--mid)" : "var(--low)";
}

function buildGauge(score, label, featured) {
  const size = featured ? 148 : 110;
  const sw   = featured ? 11  : 8;
  const r    = (size - sw * 2) / 2;
  const circ = 2 * Math.PI * r;
  const cx = size / 2, cy = size / 2;
  const col = scoreColor(score || 0);
  const offset = circ * (1 - Math.max(0, Math.min(1, (score || 0) / 10)));

  const wrap = document.createElement("div");
  wrap.className = "gauge-card" + (featured ? " featured" : "");
  wrap.innerHTML = `
    <svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
      <circle cx="${cx}" cy="${cy}" r="${r}"
        fill="none" stroke="${featured ? "#c5dab2" : "#eceeed"}" stroke-width="${sw}"/>
      <circle class="gauge-arc" cx="${cx}" cy="${cy}" r="${r}"
        fill="none" stroke="${col}" stroke-width="${sw}"
        stroke-linecap="round"
        stroke-dasharray="${circ}"
        stroke-dashoffset="${circ}"
        transform="rotate(-90 ${cx} ${cy})"
        style="transition:stroke-dashoffset 1.2s cubic-bezier(.34,1.12,.64,1);"
        data-target="${offset}"/>
      <text x="${cx}" y="${cy - (featured ? 7 : 5)}"
        text-anchor="middle" dominant-baseline="central"
        font-size="${featured ? 32 : 24}" font-weight="800"
        fill="var(--text)" font-family="Inter,sans-serif">${score ?? "–"}</text>
      <text x="${cx}" y="${cy + (featured ? 22 : 17)}"
        text-anchor="middle" dominant-baseline="central"
        font-size="10" fill="var(--text-subtle)"
        font-family="Inter,sans-serif">/ 10</text>
    </svg>
    <div class="gauge-label">${label}</div>`;
  return wrap;
}

function renderScoring(s) {
  const panel = document.getElementById("scoring-panel");
  panel.innerHTML = "";
  const items = [
    { score: s.gesamt,         label: "Gesamt",         featured: true },
    { score: s.positionierung, label: "Positionierung",  featured: false },
    { score: s.demand,         label: "Demand",          featured: false },
    { score: s.competitive,    label: "Competitive",     featured: false },
    { score: s.ai_visibility,  label: "AI Visibility",   featured: false },
  ];
  items.forEach(it => panel.appendChild(buildGauge(it.score, it.label, it.featured)));
  requestAnimationFrame(() => requestAnimationFrame(() => {
    panel.querySelectorAll(".gauge-arc").forEach(arc => {
      arc.style.strokeDashoffset = arc.getAttribute("data-target");
    });
  }));
}

/* ── Section parsing ── */
function parseSections(md) {
  const lines = md.split("\n");
  const out = [];
  let cur = null;
  for (const line of lines) {
    const m = line.match(/^##\s+(.+?)\s*$/);
    if (m) {
      if (cur) out.push(cur);
      cur = { title: m[1].trim(), body: [] };
    } else if (cur) {
      cur.body.push(line);
    }
  }
  if (cur) out.push(cur);
  return out.map(s => {
    const meta = metaFor(s.title);
    return {
      title: s.title,
      icon: meta.icon,
      desc: meta.desc,
      body: s.body.join("\n")
        .replace(/^\s*-{3,}\s*$/gm, "")
        .replace(/\n\*Dieser Report[\s\S]*$/i, "")
        .replace(/\n\*Super Analyst[\s\S]*$/i, "")
        .trim(),
    };
  }).filter(s => s.body.length > 0);
}

/* ── Executive summary ── */
function renderExec() {
  const exec = sections.find(s => /executive/i.test(s.title));
  const card = document.getElementById("exec-card");
  if (exec) {
    document.getElementById("exec-content").innerHTML = marked.parse(exec.body);
    card.hidden = false;
  } else {
    card.hidden = true;
  }
}

/* ── Section grid ── */
function renderGrid() {
  const grid = document.getElementById("section-grid");
  grid.innerHTML = "";
  sections.forEach((sec, i) => {
    if (/executive/i.test(sec.title)) return;
    const btn = document.createElement("button");
    btn.className = "section-card";
    btn.type = "button";
    btn.innerHTML = `
      <div class="card-icon-row">
        <div class="card-icon">${SVGS[sec.icon] || SVGS.default}</div>
      </div>
      <div class="card-title">${sec.title}</div>
      ${sec.desc ? `<div class="card-desc">${sec.desc}</div>` : ""}
      <div class="card-arrow">Öffnen <svg width="12" height="12" viewBox="0 0 15 15" fill="none"><path d="M6 3l5 4.5L6 12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></div>`;
    btn.onclick = () => openSection(i);
    grid.appendChild(btn);
  });
}

/* ── Section detail ── */
function openSection(i) {
  currentIdx = i;
  const sec = sections[i];
  document.getElementById("breadcrumb-title").textContent = sec.title;
  document.getElementById("section-heading").textContent  = sec.title;
  document.getElementById("section-icon-lg").innerHTML    = SVGS[sec.icon] || SVGS.default;
  document.getElementById("section-content").innerHTML    = marked.parse(sec.body);

  // Prev / Next
  const nonExec = sections.filter((_, idx) => !/executive/i.test(sections[idx].title));
  const pos = nonExec.findIndex((_, idx) => {
    const realIdx = sections.findIndex(s => s === nonExec[idx]);
    return realIdx === i;
  });
  const nav = document.getElementById("section-nav");
  nav.innerHTML = "";

  const prevReal = i - 1 >= 0 && !/executive/i.test(sections[i-1]?.title) ? i - 1 : -1;
  const nextReal = i + 1 < sections.length ? i + 1 : -1;

  if (prevReal >= 0) {
    const b = document.createElement("button");
    b.className = "btn-outline"; b.type = "button";
    b.innerHTML = `<svg width="12" height="12" viewBox="0 0 15 15" fill="none"><path d="M9 3L4 7.5 9 12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg> Zurück`;
    b.onclick = () => openSection(prevReal);
    nav.appendChild(b);
  }
  if (nextReal >= 0) {
    const b = document.createElement("button");
    b.className = "btn-outline"; b.type = "button";
    b.innerHTML = `Weiter <svg width="12" height="12" viewBox="0 0 15 15" fill="none"><path d="M6 3l5 4.5L6 12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
    b.onclick = () => openSection(nextReal);
    nav.appendChild(b);
  }

  showView("section");
}

/* ── Analysis ── */
function cleanUrl(s) {
  // Remove BOM (﻿), zero-width spaces and other invisible chars
  // that get silently embedded when pasting from Excel / Word / some browsers
  return s.trim().replace(/^[﻿​‌‍­]+/, "");
}

async function startAnalysis() {
  const url = cleanUrl(document.getElementById("url").value);
  if (!url) { showError("Bitte eine Unternehmenswebsite eingeben."); return; }

  const linkedin = cleanUrl(document.getElementById("linkedin").value);
  const google   = document.getElementById("google").checked;

  document.getElementById("error-box").style.display = "none";
  document.getElementById("progress-log").innerHTML  = "";
  document.getElementById("progress-title").textContent = "Analyse läuft…";
  document.getElementById("progress-spinner").style.display = "";
  document.getElementById("start-btn").disabled = true;
  document.getElementById("start-btn").textContent = "Analyse läuft…";
  showView("progress");

  try {
    const resp = await fetch("/api/analyze", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ url, linkedin_url: linkedin, enable_google: google }),
    });

    const reader  = resp.body.getReader();
    const decoder = new TextDecoder();
    let buffer = "";

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      const parts = buffer.split("\n");
      buffer = parts.pop();

      let event = null, data = null;
      for (const line of parts) {
        if (line.startsWith("event: ")) event = line.slice(7).trim();
        if (line.startsWith("data: ")) {
          try { data = JSON.parse(line.slice(6)); } catch {}
        }
        if (event && data) { handleEvent(event, data); event = null; data = null; }
      }
    }
  } catch (e) {
    showError(e.message);
    showView("input");
  } finally {
    document.getElementById("start-btn").disabled = false;
    document.getElementById("start-btn").textContent = "Analyse starten";
  }
}

function handleEvent(event, data) {
  if (event === "progress") {
    logMsg(data.msg);
  } else if (event === "done") {
    reportText = data.report;
    sections   = parseSections(reportText);

    document.getElementById("dash-company").textContent  = data.firmenname || "Report";
    document.getElementById("dash-sub-text").textContent =
      "Analyse abgeschlossen · " + sections.length + " Bereiche";

    renderScoring(data.scoring || {});
    renderExec();
    renderGrid();

    const blob = new Blob([reportText], { type: "text/markdown" });
    const dl   = document.getElementById("download-btn");
    dl.href     = URL.createObjectURL(blob);
    dl.download  = "superanalyst_" +
      (data.firmenname || "report").toLowerCase().replace(/\s+/g, "_") + ".md";

    showView("dashboard");
  } else if (event === "error") {
    showError(data.msg);
    showView("input");
  }
}

document.getElementById("url").addEventListener("keydown", e => {
  if (e.key === "Enter") { e.preventDefault(); startAnalysis(); }
});
</script>
