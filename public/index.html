<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Super Analyst</title>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #f8f9fa;
    color: #1a1a2e;
    min-height: 100vh;
  }

  header {
    background: #fff;
    border-bottom: 1px solid #e9ecef;
    padding: 1.25rem 2rem;
    display: flex;
    align-items: center;
    gap: 0.75rem;
  }

  header h1 { font-size: 1.4rem; font-weight: 700; }
  header span { font-size: 1.6rem; }
  header p { font-size: 0.85rem; color: #6c757d; margin-top: 0.1rem; }

  main {
    max-width: 820px;
    margin: 2.5rem auto;
    padding: 0 1.5rem;
  }

  .card {
    background: #fff;
    border: 1px solid #e9ecef;
    border-radius: 12px;
    padding: 2rem;
    margin-bottom: 1.5rem;
  }

  label { font-weight: 600; font-size: 0.9rem; display: block; margin-bottom: 0.4rem; }

  input[type="text"] {
    width: 100%;
    padding: 0.7rem 1rem;
    border: 1.5px solid #dee2e6;
    border-radius: 8px;
    font-size: 1rem;
    transition: border-color 0.2s;
    outline: none;
  }
  input[type="text"]:focus { border-color: #4361ee; }

  .optional-section {
    margin-top: 1.2rem;
    padding-top: 1.2rem;
    border-top: 1px solid #f1f3f5;
  }

  .optional-toggle {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    cursor: pointer;
    font-size: 0.85rem;
    color: #6c757d;
    margin-bottom: 1rem;
    user-select: none;
  }

  .optional-fields { display: none; }
  .optional-fields.open { display: block; }

  .checkbox-row {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    margin-top: 0.75rem;
    font-size: 0.9rem;
  }

  .btn {
    margin-top: 1.5rem;
    width: 100%;
    padding: 0.85rem;
    background: #4361ee;
    color: #fff;
    border: none;
    border-radius: 8px;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.2s;
  }
  .btn:hover:not(:disabled) { background: #3451d1; }
  .btn:disabled { background: #adb5bd; cursor: not-allowed; }

  /* Progress */
  #progress-box {
    display: none;
    background: #fff;
    border: 1px solid #e9ecef;
    border-radius: 12px;
    padding: 1.5rem 2rem;
    margin-bottom: 1.5rem;
  }
  #progress-box h3 { font-size: 1rem; margin-bottom: 1rem; color: #4361ee; }
  #progress-log { font-size: 0.88rem; line-height: 1.8; color: #495057; }

  /* Scores */
  #scores-box { display: none; margin-bottom: 1.5rem; }

  .scores-grid {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 1rem;
  }

  .score-card {
    background: #fff;
    border: 1px solid #e9ecef;
    border-radius: 10px;
    padding: 1rem;
    text-align: center;
  }
  .score-card.highlight { background: #4361ee; color: #fff; border-color: #4361ee; }
  .score-card .score-val { font-size: 2rem; font-weight: 800; }
  .score-card .score-label { font-size: 0.75rem; margin-top: 0.25rem; opacity: 0.8; }

  /* Report */
  #report-box { display: none; }

  .report-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 1rem;
  }

  .download-btn {
    padding: 0.5rem 1.2rem;
    background: #f8f9fa;
    border: 1.5px solid #dee2e6;
    border-radius: 8px;
    font-size: 0.85rem;
    font-weight: 600;
    cursor: pointer;
    text-decoration: none;
    color: #1a1a2e;
    transition: background 0.2s;
  }
  .download-btn:hover { background: #e9ecef; }

  #report-content {
    font-size: 0.92rem;
    line-height: 1.75;
  }

  #report-content h1 { font-size: 1.5rem; margin: 1.5rem 0 0.75rem; }
  #report-content h2 { font-size: 1.15rem; margin: 1.5rem 0 0.5rem; color: #4361ee; border-bottom: 2px solid #e9ecef; padding-bottom: 0.3rem; }
  #report-content h3 { font-size: 1rem; margin: 1rem 0 0.4rem; }
  #report-content p { margin-bottom: 0.75rem; }
  #report-content table { width: 100%; border-collapse: collapse; margin: 1rem 0; font-size: 0.88rem; }
  #report-content th { background: #f8f9fa; padding: 0.5rem 0.75rem; text-align: left; border: 1px solid #dee2e6; }
  #report-content td { padding: 0.5rem 0.75rem; border: 1px solid #dee2e6; vertical-align: top; }
  #report-content ul, #report-content ol { padding-left: 1.5rem; margin-bottom: 0.75rem; }
  #report-content li { margin-bottom: 0.3rem; }
  #report-content code { background: #f8f9fa; padding: 0.1rem 0.4rem; border-radius: 4px; font-size: 0.85em; }
  #report-content hr { border: none; border-top: 1px solid #e9ecef; margin: 1.5rem 0; }
  #report-content strong { font-weight: 700; }

  .error-msg {
    background: #fff5f5;
    border: 1px solid #ffc9c9;
    border-radius: 8px;
    padding: 1rem 1.25rem;
    color: #c92a2a;
    font-size: 0.9rem;
    display: none;
    margin-bottom: 1rem;
  }

  @media (max-width: 600px) {
    .scores-grid { grid-template-columns: repeat(3, 1fr); }
  }
</style>
</head>
<body>

<header>
  <span>🔍</span>
  <div>
    <h1>Super Analyst</h1>
    <p>KI-gestützte Unternehmensanalyse — Demand, Competitive & AI Visibility Intelligence</p>
  </div>
</header>

<main>
  <!-- Input -->
  <div class="card">
    <label for="url">Unternehmenswebsite *</label>
    <input type="text" id="url" placeholder="https://www.beispiel.de" />

    <div class="optional-section">
      <div class="optional-toggle" onclick="toggleOptional()">
        <span id="toggle-icon">▶</span> Optionale Quellen
      </div>
      <div class="optional-fields" id="optional-fields">
        <label for="linkedin">LinkedIn-URL</label>
        <input type="text" id="linkedin" placeholder="https://www.linkedin.com/company/..." />
        <div class="checkbox-row">
          <input type="checkbox" id="google" />
          <label for="google" style="font-weight:400; margin:0;">Google News einbeziehen</label>
        </div>
      </div>
    </div>

    <button class="btn" id="start-btn" onclick="startAnalysis()">Analyse starten</button>
  </div>

  <!-- Error -->
  <div class="error-msg" id="error-box"></div>

  <!-- Progress -->
  <div id="progress-box">
    <h3>⏳ Analyse läuft...</h3>
    <div id="progress-log"></div>
  </div>

  <!-- Scores -->
  <div id="scores-box">
    <div class="scores-grid">
      <div class="score-card"><div class="score-val" id="s-pos">–</div><div class="score-label">Positionierung</div></div>
      <div class="score-card"><div class="score-val" id="s-dem">–</div><div class="score-label">Demand</div></div>
      <div class="score-card"><div class="score-val" id="s-com">–</div><div class="score-label">Competitive</div></div>
      <div class="score-card"><div class="score-val" id="s-ai">–</div><div class="score-label">AI Visibility</div></div>
      <div class="score-card highlight"><div class="score-val" id="s-ges">–</div><div class="score-label">Gesamt</div></div>
    </div>
  </div>

  <!-- Report -->
  <div class="card" id="report-box">
    <div class="report-header">
      <h2 style="border:none; margin:0; color:#1a1a2e; font-size:1.1rem;" id="report-title">Report</h2>
      <a class="download-btn" id="download-btn" href="#" download>📥 Download .md</a>
    </div>
    <hr style="margin: 0.75rem 0 1.25rem;">
    <div id="report-content"></div>
  </div>
</main>

<script>
  let reportText = "";

  function toggleOptional() {
    const fields = document.getElementById("optional-fields");
    const icon = document.getElementById("toggle-icon");
    const open = fields.classList.toggle("open");
    icon.textContent = open ? "▼" : "▶";
  }

  function log(msg) {
    const el = document.getElementById("progress-log");
    el.innerHTML += msg + "<br>";
    el.scrollTop = el.scrollHeight;
  }

  function showError(msg) {
    const el = document.getElementById("error-box");
    el.textContent = "❌ Fehler: " + msg;
    el.style.display = "block";
  }

  async function startAnalysis() {
    const url = document.getElementById("url").value.trim();
    if (!url) return;

    const linkedin = document.getElementById("linkedin").value.trim();
    const google = document.getElementById("google").checked;

    // Reset UI
    document.getElementById("error-box").style.display = "none";
    document.getElementById("progress-box").style.display = "block";
    document.getElementById("progress-log").innerHTML = "";
    document.getElementById("scores-box").style.display = "none";
    document.getElementById("report-box").style.display = "none";
    document.getElementById("start-btn").disabled = true;
    document.getElementById("start-btn").textContent = "Analyse läuft...";

    try {
      const resp = await fetch("/api/analyze", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ url, linkedin_url: linkedin, enable_google: google }),
      });

      const reader = resp.body.getReader();
      const decoder = new TextDecoder();
      let buffer = "";

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;

        buffer += decoder.decode(value, { stream: true });
        const lines = buffer.split("\n");
        buffer = lines.pop();

        let event = null;
        let data = null;

        for (const line of lines) {
          if (line.startsWith("event: ")) event = line.slice(7).trim();
          if (line.startsWith("data: ")) {
            try { data = JSON.parse(line.slice(6)); } catch {}
          }
          if (event && data) {
            handleEvent(event, data);
            event = null;
            data = null;
          }
        }
      }

    } catch (e) {
      showError(e.message);
    } finally {
      document.getElementById("start-btn").disabled = false;
      document.getElementById("start-btn").textContent = "Analyse starten";
    }
  }

  function handleEvent(event, data) {
    if (event === "progress") {
      log(data.msg);
    }
    else if (event === "done") {
      const s = data.scoring;
      document.getElementById("s-pos").textContent = s.positionierung + "/10";
      document.getElementById("s-dem").textContent = s.demand + "/10";
      document.getElementById("s-com").textContent = s.competitive + "/10";
      document.getElementById("s-ai").textContent = s.ai_visibility + "/10";
      document.getElementById("s-ges").textContent = s.gesamt + "/10";
      document.getElementById("scores-box").style.display = "block";

      reportText = data.report;
      document.getElementById("report-title").textContent = "Report: " + data.firmenname;
      document.getElementById("report-content").innerHTML = marked.parse(reportText);

      const blob = new Blob([reportText], { type: "text/markdown" });
      const blobUrl = URL.createObjectURL(blob);
      const dl = document.getElementById("download-btn");
      dl.href = blobUrl;
      dl.download = "superanalyst_" + data.firmenname.toLowerCase().replace(/\s+/g, "_") + ".md";

      document.getElementById("report-box").style.display = "block";
      document.getElementById("progress-box").querySelector("h3").textContent = "✅ Analyse abgeschlossen";
    }
    else if (event === "error") {
      showError(data.msg);
    }
  }

  document.getElementById("url").addEventListener("keydown", (e) => {
    if (e.key === "Enter") startAnalysis();
  });
</script>
</body>
</html>
