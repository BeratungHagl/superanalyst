<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Super Analyst — Beratung Hagl</title>
<link rel="icon" href="logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #f4f6f2;
    --card: #ffffff;
    --border: #e0e0e0;
    --text: #1a1a1a;
    --muted: #6c757d;
    --primary: #517f34;
    --primary-dark: #3f6428;
    --tint: #e8f0e0;
    --good: #517f34;
    --mid: #c8901e;
    --low: #c0392b;
  }

  body {
    font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }

  header {
    background: #fff;
    border-bottom: 1px solid var(--border);
    padding: 1.1rem 2rem;
    display: flex;
    align-items: center;
    gap: 0.75rem;
    position: sticky;
    top: 0;
    z-index: 10;
  }
  header .logo { height: 38px; width: auto; display: block; }
  header h1 { font-size: 1.35rem; font-weight: 700; }
  header p { font-size: 0.82rem; color: var(--muted); margin-top: 0.1rem; }

  main {
    max-width: 980px;
    margin: 2.2rem auto;
    padding: 0 1.5rem;
  }

  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 2rem;
    margin-bottom: 1.5rem;
  }

  label { font-weight: 600; font-size: 0.9rem; display: block; margin-bottom: 0.4rem; }

  input[type="text"] {
    width: 100%;
    padding: 0.75rem 1rem;
    border: 1.5px solid #dee2e6;
    border-radius: 9px;
    font-size: 1rem;
    transition: border-color 0.2s;
    outline: none;
  }
  input[type="text"]:focus { border-color: var(--primary); }

  .optional-section {
    margin-top: 1.2rem;
    padding-top: 1.2rem;
    border-top: 1px solid #f1f3f5;
  }
  .optional-toggle {
    display: flex; align-items: center; gap: 0.5rem;
    cursor: pointer; font-size: 0.85rem; color: var(--muted);
    margin-bottom: 1rem; user-select: none;
  }
  .optional-fields { display: none; }
  .optional-fields.open { display: block; }
  .checkbox-row {
    display: flex; align-items: center; gap: 0.5rem;
    margin-top: 0.75rem; font-size: 0.9rem;
  }

  .btn {
    width: 100%;
    padding: 0.9rem;
    background: var(--primary);
    color: #fff;
    border: none;
    border-radius: 9px;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.2s;
  }
  .btn:hover:not(:disabled) { background: var(--primary-dark); }
  .btn:disabled { background: #adb5bd; cursor: not-allowed; }
  .input-card .btn { margin-top: 1.5rem; }

  /* Progress */
  #progress-box h3 { font-size: 1rem; margin-bottom: 1rem; color: var(--primary); }
  #progress-log { font-size: 0.88rem; line-height: 1.85; color: #495057; }

  /* ===== Dashboard ===== */
  .dash-top {
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
    align-items: flex-start;
    gap: 1rem;
    margin-bottom: 1.5rem;
  }
  .dash-top h2 { font-size: 1.5rem; }
  .dash-top .sub { font-size: 0.85rem; color: var(--muted); margin-top: 0.2rem; }
  .dash-actions { display: flex; gap: 0.6rem; flex-wrap: wrap; }

  .action-btn {
    padding: 0.6rem 1.1rem;
    border-radius: 9px;
    font-size: 0.85rem;
    font-weight: 600;
    cursor: pointer;
    text-decoration: none;
    border: 1.5px solid var(--border);
    background: #fff;
    color: var(--text);
    transition: background 0.2s, border-color 0.2s;
    display: inline-flex;
    align-items: center;
    gap: 0.4rem;
  }
  .action-btn:hover { background: #f1f3f5; }
  .action-btn.primary { background: var(--primary); color: #fff; border-color: var(--primary); }
  .action-btn.primary:hover { background: var(--primary-dark); }

  /* Scoring panel */
  .scoring-panel {
    display: grid;
    grid-template-columns: 1.3fr repeat(4, 1fr);
    gap: 1rem;
    align-items: center;
  }
  .gauge {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 1.1rem 0.5rem 0.9rem;
    text-align: center;
  }
  .gauge.gauge-big { background: linear-gradient(135deg, var(--tint), #f4f8f0); border-color: #c5d8b6; }
  .gauge svg { display: block; margin: 0 auto; }
  .gauge-label { font-size: 0.8rem; font-weight: 600; color: #495057; margin-top: 0.5rem; }
  .gauge-big .gauge-label { font-size: 0.9rem; color: var(--primary); }

  /* Executive summary inline */
  .exec-card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 1.6rem 1.8rem; margin: 1.5rem 0; }
  .exec-card h3 { font-size: 1rem; color: var(--primary); margin-bottom: 0.8rem; display: flex; align-items: center; gap: 0.5rem; }
  .exec-card ul { padding-left: 1.3rem; }
  .exec-card li { margin-bottom: 0.5rem; font-size: 0.93rem; line-height: 1.6; }

  /* Section grid */
  .grid-title { font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); margin: 1.8rem 0 0.9rem; font-weight: 700; }
  .section-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 1rem;
  }
  .section-tile {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 1.3rem;
    cursor: pointer;
    text-align: left;
    transition: transform 0.15s, box-shadow 0.15s, border-color 0.15s;
    display: flex;
    flex-direction: column;
    gap: 0.5rem;
  }
  .section-tile:hover {
    transform: translateY(-3px);
    box-shadow: 0 8px 24px rgba(81,127,52,0.15);
    border-color: var(--primary);
  }
  .section-tile .tile-icon { font-size: 1.7rem; }
  .section-tile .tile-name { font-weight: 700; font-size: 0.98rem; }
  .section-tile .tile-arrow { font-size: 0.8rem; color: var(--primary); margin-top: auto; font-weight: 600; }

  /* ===== Section detail ===== */
  .back-btn {
    background: none;
    border: none;
    color: var(--primary);
    font-size: 0.9rem;
    font-weight: 600;
    cursor: pointer;
    padding: 0;
    margin-bottom: 1.2rem;
    display: inline-flex;
    align-items: center;
    gap: 0.4rem;
  }
  .back-btn:hover { text-decoration: underline; }
  #section-title { font-size: 1.5rem; margin-bottom: 0.3rem; display: flex; align-items: center; gap: 0.6rem; }

  /* Markdown rendering */
  .report-content { font-size: 0.94rem; line-height: 1.75; }
  .report-content h1 { font-size: 1.5rem; margin: 1.5rem 0 0.75rem; }
  .report-content h2 { font-size: 1.2rem; margin: 1.5rem 0 0.5rem; color: var(--primary); }
  .report-content h3 { font-size: 1.02rem; margin: 1.2rem 0 0.4rem; }
  .report-content p { margin-bottom: 0.75rem; }
  .report-content table { width: 100%; border-collapse: collapse; margin: 1rem 0; font-size: 0.88rem; }
  .report-content th { background: #f8f9fa; padding: 0.55rem 0.8rem; text-align: left; border: 1px solid #dee2e6; }
  .report-content td { padding: 0.55rem 0.8rem; border: 1px solid #dee2e6; vertical-align: top; }
  .report-content ul, .report-content ol { padding-left: 1.5rem; margin-bottom: 0.75rem; }
  .report-content li { margin-bottom: 0.35rem; }
  .report-content code { background: #f1f3f5; padding: 0.1rem 0.4rem; border-radius: 4px; font-size: 0.85em; }
  .report-content hr { border: none; border-top: 1px solid var(--border); margin: 1.5rem 0; }
  .report-content strong { font-weight: 700; }

  .error-msg {
    background: #fff5f5;
    border: 1px solid #ffc9c9;
    border-radius: 9px;
    padding: 1rem 1.25rem;
    color: #c92a2a;
    font-size: 0.9rem;
    display: none;
    margin-bottom: 1rem;
  }

  [hidden] { display: none !important; }

  @media (max-width: 760px) {
    .scoring-panel { grid-template-columns: repeat(2, 1fr); }
    .section-grid { grid-template-columns: repeat(2, 1fr); }
  }
  @media (max-width: 480px) {
    .scoring-panel { grid-template-columns: repeat(2, 1fr); }
    .section-grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<header>
  <img class="logo" src="logo.png" alt="Beratung Hagl" />
  <div>
    <h1>Super Analyst</h1>
    <p>KI-gestützte Unternehmensanalyse — Beratung Hagl</p>
  </div>
</header>

<main>
  <!-- ===== VIEW: INPUT ===== -->
  <section id="view-input">
    <div class="card input-card">
      <label for="url">Unternehmenswebsite *</label>
      <input type="text" id="url" placeholder="https://www.beispiel.de" autocomplete="off" />

      <div class="optional-section">
        <div class="optional-toggle" onclick="toggleOptional()">
          <span id="toggle-icon">▶</span> Optionale Quellen
        </div>
        <div class="optional-fields" id="optional-fields">
          <label for="linkedin">LinkedIn-URL</label>
          <input type="text" id="linkedin" placeholder="https://www.linkedin.com/company/..." autocomplete="off" />
          <div class="checkbox-row">
            <input type="checkbox" id="google" />
            <label for="google" style="font-weight:400; margin:0;">Google News einbeziehen</label>
          </div>
        </div>
      </div>

      <button class="btn" id="start-btn" type="button" onclick="startAnalysis()">Analyse starten</button>
    </div>
    <div class="error-msg" id="error-box"></div>
  </section>

  <!-- ===== VIEW: PROGRESS ===== -->
  <section id="view-progress" hidden>
    <div class="card" id="progress-box">
      <h3>⏳ Analyse läuft...</h3>
      <div id="progress-log"></div>
    </div>
  </section>

  <!-- ===== VIEW: DASHBOARD ===== -->
  <section id="view-dashboard" hidden>
    <div class="dash-top">
      <div>
        <h2 id="dash-company">Report</h2>
        <div class="sub" id="dash-sub"></div>
      </div>
      <div class="dash-actions">
        <a class="action-btn primary" id="download-btn" href="#" download>📥 Report (.md) herunterladen</a>
        <button class="action-btn" type="button" onclick="resetApp()">↻ Neue Analyse</button>
      </div>
    </div>

    <div class="scoring-panel" id="scoring-panel"></div>

    <div class="exec-card" id="exec-card" hidden>
      <h3>📌 Executive Summary</h3>
      <div id="exec-content"></div>
    </div>

    <div class="grid-title">Analysebereiche — Klick für Details</div>
    <div class="section-grid" id="section-grid"></div>
  </section>

  <!-- ===== VIEW: SECTION DETAIL ===== -->
  <section id="view-section" hidden>
    <button class="back-btn" type="button" onclick="showDashboard()">← Zurück zum Dashboard</button>
    <div class="card">
      <h2 id="section-title"></h2>
      <hr style="border:none;border-top:1px solid var(--border);margin:0.9rem 0 1.3rem;">
      <div id="section-content" class="report-content"></div>
    </div>
  </section>
</main>

<script>
  let reportText = "";
  let sections = [];

  // ---- View management ----
  function showView(name) {
    ["input", "progress", "dashboard", "section"].forEach(v => {
      document.getElementById("view-" + v).hidden = (v !== name);
    });
    window.scrollTo({ top: 0, behavior: "smooth" });
  }
  function showDashboard() { showView("dashboard"); }

  function resetApp() {
    showView("input");
    document.getElementById("error-box").style.display = "none";
    document.getElementById("progress-log").innerHTML = "";
  }

  function toggleOptional() {
    const fields = document.getElementById("optional-fields");
    const icon = document.getElementById("toggle-icon");
    const open = fields.classList.toggle("open");
    icon.textContent = open ? "▼" : "▶";
  }

  function log(msg) {
    const el = document.getElementById("progress-log");
    el.innerHTML += msg + "<br>";
    el.scrollTop = el.scrollHeight;
  }

  function showError(msg) {
    const el = document.getElementById("error-box");
    el.textContent = "❌ Fehler: " + msg;
    el.style.display = "block";
  }

  // ---- Scoring gauges (SVG) ----
  function scoreColor(s) {
    return s >= 7 ? "var(--good)" : s >= 4 ? "var(--mid)" : "var(--low)";
  }

  function gaugeSVG(score, label, big) {
    const size = big ? 150 : 108;
    const stroke = big ? 13 : 9;
    const r = (size - stroke) / 2;
    const c = 2 * Math.PI * r;
    const frac = Math.max(0, Math.min(1, (score || 0) / 10));
    const offset = c * (1 - frac);
    const cx = size / 2, cy = size / 2;
    return `
      <div class="gauge ${big ? "gauge-big" : ""}">
        <svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
          <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="#eef0f4" stroke-width="${stroke}"/>
          <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${scoreColor(score)}" stroke-width="${stroke}"
            stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${c}"
            transform="rotate(-90 ${cx} ${cy})"
            style="transition: stroke-dashoffset 1.1s cubic-bezier(.22,.61,.36,1);"
            data-target="${offset}"/>
          <text x="${cx}" y="${cy - (big ? 6 : 4)}" text-anchor="middle" dominant-baseline="central"
            font-size="${big ? "2.4rem" : "1.6rem"}" font-weight="800" fill="var(--text)">${score}</text>
          <text x="${cx}" y="${cy + (big ? 20 : 15)}" text-anchor="middle" dominant-baseline="central"
            font-size="0.7rem" fill="#868e96">/ 10</text>
        </svg>
        <div class="gauge-label">${label}</div>
      </div>`;
  }

  function renderScoring(s) {
    const panel = document.getElementById("scoring-panel");
    panel.innerHTML =
      gaugeSVG(s.gesamt, "🏆 Gesamt", true) +
      gaugeSVG(s.positionierung, "Positionierung", false) +
      gaugeSVG(s.demand, "Demand", false) +
      gaugeSVG(s.competitive, "Competitive", false) +
      gaugeSVG(s.ai_visibility, "AI Visibility", false);
    // animate after paint
    requestAnimationFrame(() => {
      panel.querySelectorAll("circle[data-target]").forEach(c => {
        c.style.strokeDashoffset = c.getAttribute("data-target");
      });
    });
  }

  // ---- Section parsing ----
  const ICONS = [
    [/executive/i, "📌"],
    [/scoring/i, "📊"],
    [/unternehmensprofil|profil/i, "🏢"],
    [/datenquellen/i, "🗂️"],
    [/external/i, "🌐"],
    [/demand/i, "📈"],
    [/competitive/i, "⚔️"],
    [/ai visibility|ki|ai/i, "🤖"],
    [/strateg/i, "🎯"],
    [/beratungshypothesen|hypothesen/i, "💡"],
  ];
  function iconFor(title) {
    for (const [re, ic] of ICONS) if (re.test(title)) return ic;
    return "📄";
  }

  function parseSections(md) {
    const lines = md.split("\n");
    const out = [];
    let cur = null;
    for (const line of lines) {
      const m = line.match(/^##\s+(.+?)\s*$/);
      if (m) {
        if (cur) out.push(cur);
        cur = { title: m[1].trim(), body: [] };
      } else if (cur) {
        cur.body.push(line);
      }
    }
    if (cur) out.push(cur);
    return out.map(s => ({
      title: s.title,
      icon: iconFor(s.title),
      body: s.body.join("\n")
        .replace(/^\s*-{3,}\s*$/gm, "")          // section separators
        .replace(/\n\*Dieser Report[\s\S]*$/i, "") // footer
        .replace(/\n\*Super Analyst[\s\S]*$/i, "")
        .trim(),
    })).filter(s => s.body.length > 0);
  }

  function renderExecSummary() {
    const exec = sections.find(s => /executive/i.test(s.title));
    const card = document.getElementById("exec-card");
    if (exec) {
      document.getElementById("exec-content").innerHTML = marked.parse(exec.body);
      card.hidden = false;
    } else {
      card.hidden = true;
    }
  }

  function renderSectionGrid() {
    const grid = document.getElementById("section-grid");
    grid.innerHTML = "";
    sections.forEach((sec, i) => {
      if (/executive/i.test(sec.title)) return; // shown inline above
      const tile = document.createElement("button");
      tile.className = "section-tile";
      tile.type = "button";
      tile.innerHTML =
        `<span class="tile-icon">${sec.icon}</span>` +
        `<span class="tile-name">${sec.title}</span>` +
        `<span class="tile-arrow">Ansehen →</span>`;
      tile.onclick = () => openSection(i);
      grid.appendChild(tile);
    });
  }

  function openSection(i) {
    const sec = sections[i];
    document.getElementById("section-title").innerHTML =
      `<span>${sec.icon}</span><span>${sec.title}</span>`;
    document.getElementById("section-content").innerHTML = marked.parse(sec.body);
    showView("section");
  }

  // ---- Analysis flow ----
  async function startAnalysis() {
    const url = document.getElementById("url").value.trim();
    if (!url) {
      showError("Bitte eine Unternehmenswebsite eingeben.");
      return;
    }

    const linkedin = document.getElementById("linkedin").value.trim();
    const google = document.getElementById("google").checked;

    document.getElementById("error-box").style.display = "none";
    document.getElementById("progress-log").innerHTML = "";
    document.getElementById("progress-box").querySelector("h3").textContent = "⏳ Analyse läuft...";
    document.getElementById("start-btn").disabled = true;
    document.getElementById("start-btn").textContent = "Analyse läuft...";
    showView("progress");

    try {
      const resp = await fetch("/api/analyze", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ url, linkedin_url: linkedin, enable_google: google }),
      });

      const reader = resp.body.getReader();
      const decoder = new TextDecoder();
      let buffer = "";

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        buffer += decoder.decode(value, { stream: true });
        const parts = buffer.split("\n");
        buffer = parts.pop();

        let event = null, data = null;
        for (const line of parts) {
          if (line.startsWith("event: ")) event = line.slice(7).trim();
          if (line.startsWith("data: ")) {
            try { data = JSON.parse(line.slice(6)); } catch {}
          }
          if (event && data) { handleEvent(event, data); event = null; data = null; }
        }
      }
    } catch (e) {
      showError(e.message);
      showView("input");
    } finally {
      document.getElementById("start-btn").disabled = false;
      document.getElementById("start-btn").textContent = "Analyse starten";
    }
  }

  function handleEvent(event, data) {
    if (event === "progress") {
      log(data.msg);
    } else if (event === "done") {
      reportText = data.report;
      sections = parseSections(reportText);

      // Dashboard header
      document.getElementById("dash-company").textContent = data.firmenname || "Report";
      document.getElementById("dash-sub").textContent = "Analyse abgeschlossen · " +
        sections.length + " Bereiche";

      // Graphical scoring
      renderScoring(data.scoring || {});

      // Executive summary + section tiles
      renderExecSummary();
      renderSectionGrid();

      // Download link
      const blob = new Blob([reportText], { type: "text/markdown" });
      const dl = document.getElementById("download-btn");
      dl.href = URL.createObjectURL(blob);
      dl.download = "superanalyst_" +
        (data.firmenname || "report").toLowerCase().replace(/\s+/g, "_") + ".md";

      showView("dashboard");
    } else if (event === "error") {
      showError(data.msg);
      showView("input");
    }
  }

  // Enter bleibt als Komfort möglich, ist aber nicht erforderlich
  document.getElementById("url").addEventListener("keydown", (e) => {
    if (e.key === "Enter") { e.preventDefault(); startAnalysis(); }
  });
</script>
</body>
</html>
