<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Snake</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #1a1a2e;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      font-family: Arial, sans-serif;
      color: #eee;
    }
    h1 { margin-bottom: 10px; color: #4ecca3; letter-spacing: 4px; }
    #score { margin-bottom: 10px; font-size: 1.2rem; }
    canvas {
      border: 2px solid #4ecca3;
      background: #16213e;
      display: block;
    }
    #message {
      margin-top: 16px;
      font-size: 1rem;
      color: #aaa;
    }
  </style>
</head>
<body>
  <h1>SNAKE</h1>
  <div id="score">Punkte: 0</div>
  <canvas id="game" width="400" height="400"></canvas>
  <div id="message">Drücke eine Pfeiltaste zum Starten</div>

  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const messageEl = document.getElementById('message');

    const GRID = 20;
    const COLS = canvas.width / GRID;
    const ROWS = canvas.height / GRID;

    let snake, dir, nextDir, food, score, running, loop;

    function init() {
      snake = [{ x: 10, y: 10 }];
      dir = { x: 0, y: 0 };
      nextDir = { x: 0, y: 0 };
      score = 0;
      running = false;
      scoreEl.textContent = 'Punkte: 0';
      messageEl.textContent = 'Drücke eine Pfeiltaste zum Starten';
      placeFood();
      draw();
    }

    function placeFood() {
      do {
        food = {
          x: Math.floor(Math.random() * COLS),
          y: Math.floor(Math.random() * ROWS)
        };
      } while (snake.some(s => s.x === food.x && s.y === food.y));
    }

    function start() {
      if (!running) {
        running = true;
        messageEl.textContent = '';
        clearInterval(loop);
        loop = setInterval(tick, 130);
      }
    }

    function tick() {
      dir = { ...nextDir };
      if (dir.x === 0 && dir.y === 0) return;

      const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

      if (head.x < 0 || head.x >= COLS || head.y < 0 || head.y >= ROWS ||
          snake.some(s => s.x === head.x && s.y === head.y)) {
        gameOver();
        return;
      }

      snake.unshift(head);

      if (head.x === food.x && head.y === food.y) {
        score++;
        scoreEl.textContent = `Punkte: ${score}`;
        placeFood();
      } else {
        snake.pop();
      }

      draw();
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // food
      ctx.fillStyle = '#e94560';
      ctx.beginPath();
      ctx.arc(food.x * GRID + GRID / 2, food.y * GRID + GRID / 2, GRID / 2 - 2, 0, Math.PI * 2);
      ctx.fill();

      // snake
      snake.forEach((s, i) => {
        ctx.fillStyle = i === 0 ? '#4ecca3' : '#2ea88a';
        ctx.fillRect(s.x * GRID + 1, s.y * GRID + 1, GRID - 2, GRID - 2);
      });
    }

    function gameOver() {
      clearInterval(loop);
      running = false;
      messageEl.textContent = `Game Over! Punkte: ${score} — Pfeiltaste zum Neustart`;
      setTimeout(init, 1500);
    }

    document.addEventListener('keydown', e => {
      const map = {
        ArrowUp:    { x: 0,  y: -1 },
        ArrowDown:  { x: 0,  y:  1 },
        ArrowLeft:  { x: -1, y:  0 },
        ArrowRight: { x:  1, y:  0 },
      };
      const d = map[e.key];
      if (!d) return;
      e.preventDefault();
      if (dir.x !== 0 && d.x !== 0) return;
      if (dir.y !== 0 && d.y !== 0) return;
      nextDir = d;
      start();
    });

    init();
  </script>
</body>
</html>
